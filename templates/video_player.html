<div style="margin: 30px 0 40px 0; border-radius: 12px; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.1); background: #1e1e2e; border: 1px solid #e5e7eb;">
    
    {% if lesson_data and lesson_data.video_url %}
        <video width="100%" height="auto" controls style="display: block; background: #000; max-height: 480px;">
            <source src="{{ lesson_data.video_url }}" type="video/mp4">
            Your browser does not support the video tag.
        </video> 
        
        <div style="padding: 15px 20px; background: #ffffff; display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #e5e7eb;">
            <div style="display: flex; align-items: center; gap: 10px;">
                <span style="background: #e0e7ff; color: #4f46e5; padding: 5px 10px; border-radius: 4px; font-size: 12px; font-weight: bold; text-transform: uppercase;">Video Lesson</span>
                <span style="color: #333; font-weight: 600; font-size: 15px;">{{ lesson_data.title }}</span>
            </div>
            <span style="color: #888; font-size: 12px;">Posted by <strong>Prof. Admin</strong></span>
        </div>

    {% else %}
        <div style="padding: 60px 20px; text-align: center; background: #f9fafb;">
            <p style="color: #6b7280; font-size: 16px; margin: 0;"><i>The Professor has not uploaded a video for this lesson yet.</i></p>
        </div>
    {% endif %}

</div>
