{% extends "base.html" %}

{% block content %}

<div class="main-container">
    <header class="page-header">
        <p class="welcome-text">Welcome to</p>
        <h1>ITN108 Visualizer</h1>
    </header>

    <section class="featured-section">
        <div class="section-header">
            <h2>Featured Modules</h2>
        </div>

        <div class="card-container">
            <div class="course-card">
                <div class="card-top bg-purple">
                    <p class="course-subtitle">Module 1</p>
                    <h3 class="course-title">Encryption & Decryption</h3>
                </div>
                <div class="card-bottom">
                    <div class="card-stats">
                        <div class="stat">
                            <span class="stat-number">2</span>
                            <span class="stat-label">Concepts</span>
                        </div>
                        <div class="stat">
                            <span class="stat-number">1</span>
                            <span class="stat-label">Interactive</span>
                        </div>
                    </div>
                    <a href="{{ url_for('module1_intro') }}" class="play-btn">▶</a>
                </div>
            </div>

            <div class="course-card">
                <div class="card-top bg-green">
                    <p class="course-subtitle">Module 2</p>
                    <h3 class="course-title">Symmetric Encryption</h3>
                </div>
                <div class="card-bottom">
                    <div class="card-stats">
                        <div class="stat">
                            <span class="stat-number">3</span>
                            <span class="stat-label">Concepts</span>
                        </div>
                        <div class="stat">
                            <span class="stat-number">2</span>
                            <span class="stat-label">Interactive</span>
                        </div>
                    </div>
                    <a href="#" class="play-btn">▶</a>
                </div>
            </div>

            <div class="course-card">
                <div class="card-top bg-orange">
                    <p class="course-subtitle">Module 3</p>
                    <h3 class="course-title">Key Exchange Problem</h3>
                </div>
                <div class="card-bottom">
                    <div class="card-stats">
                        <div class="stat">
                            <span class="stat-number">4</span>
                            <span class="stat-label">Concepts</span>
                        </div>
                        <div class="stat">
                            <span class="stat-number">1</span>
                            <span class="stat-label">Interactive</span>
                        </div>
                    </div>
                    <a href="#" class="play-btn">▶</a>
                </div>
            </div>
        </div>
    </section>
</div>
{% endblock %}
