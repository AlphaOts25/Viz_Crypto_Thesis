<aside class="sidebar" id="sidebar">

    <h3 class="sidebar-title">Curriculum</h3>

    <!-- Pre-Test -->
    {% if pre_test_exists %}
    <a href="{{ url_for('take_test', test_type='pre') }}" class="sidebar-assessment">
        Pre-Test
    </a>
    {% endif %}

    <!-- Module 1 -->
    <button class="dropdown-btn">
        Module 1: Encryption/Decryption
        <span class="arrow">▼</span>
    </button>

    <div class="dropdown-container">
        <a href="{{ url_for('module_intro', module_num=1) }}"
           style="font-weight: bold; color: #6366f1;">

            Introduction
        </a>

        <a href="{{ url_for('view_lesson', module_num=1, lesson_num=1) }}">
            Plaintext vs Ciphertext
        </a>

        <a href="{{ url_for('view_lesson', module_num=1, lesson_num=2) }}">
            Classical Cryptography
        </a>
    </div>

    <!-- Module 2 -->
    <button class="dropdown-btn">
        Module 2: Symmetric Encryption
        <span class="arrow">▼</span>
    </button>

    <div class="dropdown-container">
        <a href="{{ url_for('module_intro', module_num=2) }}"
           style="font-weight: bold; color: #6366f1;">

            Introduction
        </a>

        <a href="{{ url_for('view_lesson', module_num=2, lesson_num=1) }}">
            Shared Key Concept
        </a>

        <a href="{{ url_for('view_lesson', module_num=2, lesson_num=2) }}">
            Key Distribution Problem
        </a>

        <a href="{{ url_for('view_lesson', module_num=2, lesson_num=3) }}">
            Diffie-Hellman Exchange
        </a>
    </div>

    <!-- Post-Test -->
    {% if post_test_exists %}
    <a href="{{ url_for('take_test', test_type='post') }}" class="sidebar-assessment">
        Post-Test
    </a>
    {% endif %}
</aside>
